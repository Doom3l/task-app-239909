name: "Test and Scan"

on: 
  push:
    branches:
      - main

jobs:
  run_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [tasks-api, title-normalizer] # ${{matrix.service}}
        python-version: [3.10, 3.11, 3.12] # ${{matrix.python-version}}
    steps:
      - uses: actions/checkout@v7
      - name: "Install python"
        uses: actions/setup-python@v7
        with:
          python-version: "${{matrix.python-version}}"
      - name: "Install dependencies"
        run: pip install -r services/${{matrix.service}}/requirements.txt
      - name: "Run tests"
        run: pytest services/tasks-api/tests
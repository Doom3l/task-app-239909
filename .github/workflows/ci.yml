name: "Test and Scan"

on: 
  push:
    branches:
      - main

jobs:
  run_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: "Install python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r services/tasks-api/requirements.txt
      - name: "Run tests"
        run: python -m pytest services/tasks-api/tests
name: "Test and Scan"

on: 
  push:
    branches:
      - main

jobs:
  run_test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [tasks-api, title-normalizer] # ${{matrix.service}}
        python-version: ["3.10", "3.11", "3.12"] # ${{matrix.python-version}}
    steps:
      - uses: actions/checkout@v7
      - name: "Install python"
        uses: actions/setup-python@v7
        with:
          python-version: "${{matrix.python-version}}"
      - name: "Install dependencies"
        run: pip install -r services/${{matrix.service}}/requirements.txt
      - shell: bash
      - name: "Run tests"
        run: pytest -rA services/${{matrix.service}}/tests | tee ${{matrix.service}}-test-report-${{matrix.python-version}}.txt
      - name: "Upload report"
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{matrix.service}}-test-report-${{matrix.python-version}}
          path: ${{matrix.service}}-test-report-${{matrix.python-version}}.txt
